<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <title>Rick And Morty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&display=swap"

  <body>
    <footer class="footer footer_container">
      <div class="footer-info">
        <img
          src="./images/footer-logo2.svg"
          alt="Rick and Morty footer logo"
          class="footer-logo"
        />
        <div class="footer-something">
          <div class="footer-menu">
            <ul class="footer-menu-list">
              <li><a class="footer-menu-item" href="#">Characters</a></li>
              <li><a class="footer-menu-item" href="#">Episodes</a></li>
            </ul>
          </div>

          <div class="footer-socials">
            <ul class="social-list">
              <li class="social-item">
                <a href="#"
                  ><img class="social" src="./images/facebook.svg" alt=""
                /></a>
              </li>
              <li class="social-item">
                <a href="#"
                  ><img class="social" src="./images/twitter.svg" alt=""
                /></a>
              </li>
              <li class="social-item">
                <a href="#"
                  ><img class="social" src="./images/instagram.svg" alt=""
                /></a>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <p class="footer-legal">Privacy Policy Public Offering Agreement</p>
    </footer>

    <script type="module" src="./main.js"></script>
